name: GitHub Pages デプロイ

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: ビルド
        run: npm run build
        env:
          # GitHub Pages のサブパス: /<リポジトリ名>/
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - name: GitHub Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へのデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
